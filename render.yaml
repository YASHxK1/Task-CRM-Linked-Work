# Render Blueprint for Task CRM (Linked Work)
# Deploy: push this repo to a Render Git repo (or use "New Blueprint" with
# this file), set the vault-secret env vars below, and Render will build the
# Docker image and provision a managed MySQL database.

databases:
  - name: task-crm-db
    plan: free
    databaseName: task_crm
    user: task_crm

services:
  - type: web
    name: task-crm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-crm-db
          property: connectionString
      # Signing secret for session cookies (generate a long random string)
      - key: JWT_SECRET
        generateValue: true
      # Manus OAuth + platform integration - fill these in the Render dashboard
      - key: VITE_APP_ID
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false