# Render Blueprint for Task CRM (Linked Work)
# Deploy: push this repo to a Render Git repo (or use "New Blueprint" with
# this file). Render will build the Docker image and provision a managed
# MySQL database. No external credentials are required.

databases:
  - name: task-crm-db
    plan: free
    databaseName: task_crm
    user: task_crm

services:
  - type: web
    name: task-crm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-crm-db
          property: connectionString